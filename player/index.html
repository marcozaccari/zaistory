<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12141a" />
    <title>zaiplay — player di test ZAiStory</title>
  </head>
  <body>
    <!-- Schermata iniziale: senza IR non c'e' niente da giocare. -->
    <section id="loader" class="loader">
      <div class="loader-card">
        <h1>zaiplay</h1>
        <p class="sub">Player di test per <code>story.ir.json</code>. Nessun asset: solo l'IR.</p>

        <label class="drop" id="drop">
          <input type="file" id="file" accept=".json,application/json" hidden />
          <strong>Scegli un file .ir.json</strong>
          <span>oppure trascinalo qui</span>
        </label>

        <details class="paste">
          <summary>Incolla il JSON</summary>
          <textarea id="paste-area" rows="6" placeholder='{ "ir_version": "1.2.0", ... }'></textarea>
          <button id="paste-go" class="btn">Carica</button>
        </details>

        <p class="hint">
          Si puo' anche aprire con <code>?ir=URL</code> nella barra degli indirizzi.
        </p>
        <p class="err" id="loader-err" hidden></p>
      </div>
    </section>

    <!-- Player -->
    <div id="app" class="app" hidden>
      <header class="topbar">
        <button class="icon" id="btn-panel" aria-label="Pannello di debug">☰</button>
        <div class="titles">
          <strong id="story-title"></strong>
          <span id="story-meta"></span>
        </div>
        <button class="icon toggle" id="btn-debug" aria-pressed="false" title="Modalita' debug">debug</button>
      </header>

      <!-- Il palco: l'inquadratura corrente e cio' che la descrive, fermi in
           alto. La figura (o, senza immagini, il suo prompt), le facce del
           cast di lato, e sotto la riga che dice sempre il tono, dove siamo e
           chi e' in campo. Il testo scorre sotto, e la maniglia riduce la
           figura quando serve piu' spazio per leggere. Nasce chiuso: sulla
           copertina non c'e' ancora nessuna scena. -->
      <section id="palco" class="palco" hidden aria-label="l'inquadratura corrente">
        <div class="palco-riga" id="palco-riga"></div>
        <div class="palco-corpo">
          <div class="palco-tela" id="palco-tela"></div>
          <div class="palco-cast" id="palco-cast" aria-label="chi c'e' in questa scena"></div>
        </div>
        <button
          class="palco-maniglia"
          id="palco-maniglia"
          type="button"
          aria-controls="palco-tela"
          aria-expanded="true"
          aria-label="riduci l'immagine"
          title="riduci l'immagine"
        >
          <span class="tacca"></span>
        </button>
      </section>

      <main id="transcript" class="transcript" tabindex="-1"></main>

      <footer id="dock" class="dock"></footer>
    </div>

    <!-- Pannello laterale -->
    <aside id="panel" class="panel" hidden>
      <div class="panel-head">
        <!-- Stessa icona e stessa posizione del bottone che apre: e' un
             interruttore, non due comandi diversi. -->
        <button class="icon" id="btn-close-panel" aria-label="Chiudi il menu">☰</button>
        <nav class="tabs" id="tabs">
          <button data-tab="principale" class="on">principale</button>
          <button data-tab="disco">disco</button>
          <button data-tab="interprete">interprete</button>
          <button data-tab="ascolto">ascolto</button>
          <!-- Le schede di ispezione compaiono solo a debug acceso: chi gioca
               non ha niente da farci, e un elenco di azioni o di flag risolve
               gli enigmi al posto suo. -->
          <button data-tab="stato" data-debug>stato</button>
          <button data-tab="linter" data-debug>linter<span class="badge" id="lint-badge" hidden></span></button>
          <button data-tab="traccia" data-debug>traccia</button>
        </nav>
      </div>
      <div class="panel-body" id="panel-body"></div>
      <div class="panel-foot" id="panel-foot">
        <span id="panel-version"></span>
        <div class="piede-azioni">
          <button class="icon" id="btn-restart" title="Ricomincia la partita">ricomincia</button>
          <button class="icon toggle" id="btn-debug-panel" aria-pressed="false" title="Modalita' debug">debug</button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
