<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12141a" />
    <title>zaiplay</title>
  </head>
  <body>
    <!-- Senza una storia non c'è niente da giocare. -->
    <section id="loader" class="loader">
      <div class="loader-card">
        <h1>zaiplay</h1>
        <p class="sub">Il player di <code>&lt;id&gt;.zaistory.json</code>. Nient'altro: la storia basta a sé.</p>

        <label class="drop" id="drop">
          <input type="file" id="file" accept=".json,application/json" hidden />
          <strong>Scegli un file .zaistory.json</strong>
          <span>oppure trascinalo qui</span>
        </label>

        <details class="paste">
          <summary>Incolla il JSON</summary>
          <textarea id="paste-area" rows="6" placeholder='{ "zaistory_version": "1.0.0", ... }'></textarea>
          <button id="paste-go" class="btn">Carica</button>
        </details>

        <p class="hint">Si può anche aprire con <code>?story=URL</code> nella barra degli indirizzi.</p>
        <p class="err" id="loader-err" hidden></p>
      </div>
    </section>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <button class="icon" id="btn-panel" aria-label="Menu">☰</button>
        <div class="titles">
          <strong id="story-title"></strong>
          <span id="story-meta"></span>
        </div>
        <!-- Testo o immagini: un interruttore, non una scheda del menu. Si
             cambia guardando quello che cambia, e nasce nascosto — compare
             solo quando c'è davvero qualcosa da scegliere. -->
        <button class="icon toggle immagini" id="btn-immagini" aria-pressed="true" hidden></button>
        <!-- Il carattere della prosa: accanto all'interruttore delle immagini
             perché è la stessa specie di scelta — come si guarda la storia — e
             si prende guardando quello che cambia. Non è un interruttore ma un
             giro: a ogni tocco passa al carattere dopo, e la scritta accanto
             al segno dice sempre a quale si è arrivati. Il contenuto lo mette
             `main.ts`: il segno è un disegno, non un carattere da stampare. -->
        <button class="icon carattere" id="btn-font"></button>
        <button class="icon toggle" id="btn-debug" aria-pressed="false" title="Modalità debug">debug</button>
      </header>

      <!--
        Il palco: l'inquadratura corrente e ciò che la descrive, ferme in alto.
        La riga delle coordinate sta in cima, sopra la figura: è la prima cosa
        che si legge entrando, e da lì fa da chiave a tutto quello che scorre
        sotto. La maniglia riduce la figura quando serve più spazio per
        leggere; il tono resta in tutte e due le misure.
      -->
      <section id="palco" class="palco" hidden aria-label="l'inquadratura corrente">
        <div class="palco-riga" id="palco-riga"></div>
        <div class="palco-corpo">
          <div class="palco-tela" id="palco-tela"></div>
          <div class="palco-cast" id="palco-cast" aria-label="chi c'è qui"></div>
        </div>
        <button
          class="palco-maniglia"
          id="palco-maniglia"
          type="button"
          aria-controls="palco-tela"
          aria-expanded="true"
          aria-label="riduci l'immagine"
          title="riduci l'immagine"
        >
          <span class="tacca"></span>
        </button>
      </section>

      <main id="transcript" class="transcript" tabindex="-1"></main>

      <footer id="dock" class="dock"></footer>
    </div>

    <!-- La mappa: ci si muove a scelte, come si parla a scelte. -->
    <aside id="mappa" class="cassetto" hidden aria-label="dove andare">
      <div class="cassetto-testa">
        <button class="icon" id="btn-chiudi-mappa" aria-label="Chiudi la mappa">✕</button>
        <strong>dove andare</strong>
      </div>
      <div class="cassetto-corpo" id="mappa-corpo"></div>
    </aside>

    <!-- L'inventario. Sta qui accanto alla mappa e non nel menu perche' e'
         materiale di gioco e non un'impostazione: quello che si ha in mano e'
         l'unica cosa che il giocatore non puo' rileggere scorrendo indietro,
         perche' non e' mai stata scritta tutta insieme da nessuna parte. Si
         apre col pollice mentre si gioca, dallo stesso posto della mappa. -->
    <aside id="inventario" class="cassetto" hidden aria-label="cosa hai in mano">
      <div class="cassetto-testa">
        <button class="icon" id="btn-chiudi-inventario" aria-label="Chiudi l'inventario">✕</button>
        <strong>inventario</strong>
      </div>
      <div class="cassetto-corpo" id="inventario-corpo"></div>
    </aside>

    <!-- Pannello laterale -->
    <aside id="panel" class="panel" hidden>
      <div class="panel-head">
        <!-- Stessa icona e stessa posizione del bottone che apre: è un
             interruttore, non due comandi diversi. -->
        <button class="icon" id="btn-close-panel" aria-label="Chiudi il menu">☰</button>
        <nav class="tabs" id="tabs">
          <button data-tab="principale" class="on">principale</button>
          <button data-tab="disco">disco</button>
          <button data-tab="interprete">interprete</button>
          <button data-tab="ascolto">ascolto</button>
          <!-- Le schede di ispezione compaiono solo a debug acceso: chi gioca
               non ha niente da farci, e un elenco di azioni o di flag risolve
               gli enigmi al posto suo. -->
          <button data-tab="stato" data-debug>stato</button>
          <button data-tab="linter" data-debug>linter<span class="badge" id="lint-badge" hidden></span></button>
        </nav>
      </div>
      <div class="panel-body" id="panel-body"></div>
      <div class="panel-foot" id="panel-foot">
        <span id="panel-version"></span>
        <div class="piede-azioni">
          <button class="icon toggle immagini" id="btn-immagini-panel" aria-pressed="true" hidden></button>
          <!-- Il giro dei caratteri anche qui: su telefono verticale la barra
               in testa tiene solo il titolo, e questo è l'unico posto dove il
               comando resta raggiungibile. -->
          <button class="icon carattere" id="btn-font-panel"></button>
          <button class="icon toggle" id="btn-debug-panel" aria-pressed="false" title="Modalità debug">debug</button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
